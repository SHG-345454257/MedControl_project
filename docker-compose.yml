services:
  db:
    image: postgres:16-alpine
    container_name: medcontrol-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medcontrol}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medcontrol_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-medcontrol}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    container_name: medcontrol-api
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 3000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: postgresql://${POSTGRES_USER:-medcontrol}:${POSTGRES_PASSWORD:-medcontrol_dev_password}@db:5432/${POSTGRES_DB:-medcontrol}?schema=public
    ports:
      - "3000:3000"
      - "5555:5555"
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: