name: Build deployment images

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [frontend, backend]
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build -f ${{ matrix.component }}/Dockerfile.prod ${{ matrix.component }}
