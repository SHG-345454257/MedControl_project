map $request_uri $page_robots {
    ~^/(?:[?]|$) "";
    default "noindex";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag $page_robots always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
